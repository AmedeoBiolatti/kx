<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kx dashboard</title>
<style>
:root {
  color-scheme: light;
  --page: #f6f6f3; --surface: #ffffff; --raised: #ffffff; --sunken: #f3f3f0;
  --ink: #111110; --ink-2: #52514e; --muted: #8a8983;
  --grid: #ebeae5; --axis: #c9c8c0; --ring: rgba(17,17,16,0.09); --border: #e6e5df;
  --accent: #2a78d6; --accent-ink: #1d5fae; --accent-soft: rgba(42,120,214,0.10);
  --series-1: #2a78d6; --series-2: #e0702a; --series-3: #2f9e6d; --series-4: #8b5cf6; --series-5: #d1495b; --series-6: #b08900; --series-7: #0e8f9a; --series-8: #c2569b; --context: #bdbcb5;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --good-ink: #0b6b0b; --warn-ink: #8a5a00; --crit-ink: #a52a2a;
  --good-soft: rgba(12,163,12,0.10); --warn-soft: rgba(250,178,25,0.16); --crit-soft: rgba(208,59,59,0.10);
  --wash: rgba(42,120,214,0.06); --chip: #f0efeb;
  --shadow: 0 1px 2px rgba(17,17,16,0.04), 0 1px 1px rgba(17,17,16,0.03);
  --shadow-lg: 0 12px 32px rgba(17,17,16,0.14);
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0f0f0e; --surface: #181817; --raised: #20201e; --sunken: #141413;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #8a8983;
    --grid: #2a2a28; --axis: #3a3a37; --ring: rgba(255,255,255,0.09); --border: #2a2a28;
    --accent: #3987e5; --accent-ink: #7fb2ef; --accent-soft: rgba(57,135,229,0.16);
    --series-1: #3987e5; --series-2: #f08a46; --series-3: #3fb883; --series-4: #a07cf8; --series-5: #e8697a; --series-6: #d4ad2c; --series-7: #2bb3bf; --series-8: #e07cbd; --context: #5a5955;
    --good-ink: #3ccf3c; --warn-ink: #f5c04a; --crit-ink: #f07a7a;
    --good-soft: rgba(12,163,12,0.18); --warn-soft: rgba(250,178,25,0.16); --crit-soft: rgba(208,59,59,0.20);
    --wash: rgba(57,135,229,0.10); --chip: #262624;
    --shadow: none; --shadow-lg: 0 12px 32px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0f0f0e; --surface: #181817; --raised: #20201e; --sunken: #141413;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #8a8983;
  --grid: #2a2a28; --axis: #3a3a37; --ring: rgba(255,255,255,0.09); --border: #2a2a28;
  --accent: #3987e5; --accent-ink: #7fb2ef; --accent-soft: rgba(57,135,229,0.16);
  --series-1: #3987e5; --series-2: #f08a46; --series-3: #3fb883; --series-4: #a07cf8; --series-5: #e8697a; --series-6: #d4ad2c; --series-7: #2bb3bf; --series-8: #e07cbd; --context: #5a5955;
  --good-ink: #3ccf3c; --warn-ink: #f5c04a; --crit-ink: #f07a7a;
  --good-soft: rgba(12,163,12,0.18); --warn-soft: rgba(250,178,25,0.16); --crit-soft: rgba(208,59,59,0.20);
  --wash: rgba(57,135,229,0.10); --chip: #262624;
  --shadow: none; --shadow-lg: 0 12px 32px rgba(0,0,0,0.5);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Inter, sans-serif; -webkit-font-smoothing: antialiased; }
select, input, button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--border); }
.bar { display: flex; align-items: center; gap: 12px; padding: 0 24px; height: 48px; max-width: 1440px; margin: 0 auto; }
.brand { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; background: var(--ink); color: var(--page); font: 700 13px/1 var(--mono); letter-spacing: -.02em; flex: none; }
.comp { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; flex: 0 1 auto; overflow: hidden; }
.comp .sub { max-width: 100%; }
.comp select { field-sizing: content; min-width: 80px; appearance: none; -webkit-appearance: none; border: 0; background: transparent; padding: 0 18px 0 0; font-weight: 650; font-size: 14px; max-width: 320px; text-overflow: ellipsis; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 7px) 55%, calc(100% - 3px) 55%; background-size: 4px 4px; background-repeat: no-repeat; }
select option { background: var(--raised); color: var(--ink); }  /* the open list: a transparent select would show it white */
.comp .sub { color: var(--muted); font-size: 11px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
a.ext { color: var(--accent-ink); text-decoration: none; white-space: nowrap; }
a.ext:hover { text-decoration: underline; }
a.ext:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 3px; }
.kmenu { position: relative; font-size: 12.5px; }
.kmenu summary { list-style: none; cursor: pointer; color: var(--accent-ink); padding: 4px 8px; border-radius: 7px; white-space: nowrap; user-select: none; }
.kmenu summary::-webkit-details-marker { display: none; }
.kmenu summary:hover, .kmenu[open] summary { background: var(--wash); }
.kmenu summary:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.kmenu .menu { position: absolute; right: 0; top: calc(100% + 4px); background: var(--raised); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 6px; display: flex; flex-direction: column; min-width: 190px; z-index: 20; }
.kmenu .menu a.ext { padding: 6px 10px; border-radius: 6px; color: var(--ink); }
.kmenu .menu a.ext:hover { background: var(--wash); text-decoration: none; }
.kmenu .menu .sep { height: 1px; background: var(--border); margin: 4px 6px; }
td.nowrap { white-space: nowrap; }
.h2sub a.ext { font-size: inherit; }
.label a.ext { color: inherit; }
.label a.ext:hover { color: var(--accent-ink); }
.icon-btn { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { background: var(--wash); color: var(--ink); }
.icon-btn svg { width: 15px; height: 15px; }
nav { display: flex; gap: 2px; align-self: stretch; margin-left: 16px; overflow-x: auto; }
nav button { position: relative; background: none; border: 0; padding: 0 10px; cursor: pointer; color: var(--ink-2); font-weight: 500; white-space: nowrap; border-radius: 6px 6px 0 0; }
nav button:hover { color: var(--ink); }
nav button[aria-selected=true] { color: var(--ink); font-weight: 600; }
nav button[aria-selected=true]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; border-radius: 2px; background: var(--ink); }
nav .count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--warn-soft); color: var(--warn-ink); font-size: 11px; font-weight: 650; text-align: center; }

/* layout */
main { max-width: 1440px; margin: 0 auto; padding: 14px 24px 48px; }
h2 { font-size: 12.5px; color: var(--ink); margin: 18px 0 6px; font-weight: 650; letter-spacing: .005em; display: flex; align-items: baseline; gap: 8px; }
h2 .h2sub { color: var(--muted); font-weight: 400; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
h2:first-child { margin-top: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; box-shadow: var(--shadow); }
.card.flush { padding: 2px 4px; }
.grid { display: grid; gap: 16px; }
.tiles { grid-template-columns: 1.4fr repeat(3, 1fr); }
.cols { grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); align-items: start; }
.cols > div > h2:first-child { margin-top: 18px; }
.stack > * + * { margin-top: 0; }
@media (max-width: 1000px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cols { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) { header { padding-bottom: 0; } .bar { flex-wrap: wrap; height: auto; padding: 8px 14px 0; } nav { order: 5; width: 100%; margin-left: -10px; height: 38px; } .meta { display: none; } .kmenu { order: 4; } .kmenu .menu { left: 0; right: auto; } }
@media (max-width: 640px) { .card.stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .card.stats .stat:nth-child(3) { border-left: 0; } .card.stats .stat:nth-child(n+3) { border-top: 1px solid var(--grid); } .need { grid-template-columns: 20px 1fr; } .need .actions { grid-column: 2; justify-content: flex-start; } .bar { padding: 10px 16px 0; } nav { padding: 6px 10px 0; } main { padding: 18px 16px 56px; } }

/* stat strip */
.stats { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; margin-top: 10px; padding: 0; }
.stat { padding: 10px 16px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--grid); }
.stat .label { color: var(--muted); font-size: 11.5px; }
.stat .value { font-size: 22px; font-weight: 650; letter-spacing: -.02em; line-height: 1.2; margin-top: 2px; white-space: nowrap; }
.stat .value small { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.stat .sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat.hero .value { font-size: 26px; color: var(--accent-ink); }
/* tiles */
.tile { display: flex; flex-direction: column; }
.tile .label { color: var(--ink-2); font-size: 12px; font-weight: 500; }
.tile .value { font-size: 22px; font-weight: 650; margin-top: 6px; letter-spacing: -.02em; line-height: 1.1; }
.tile .value small { font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.tile .sub { color: var(--muted); font-size: 12px; margin-top: auto; padding-top: 8px; overflow-wrap: anywhere; }
.tile.hero { background: linear-gradient(160deg, var(--accent-soft), transparent 70%), var(--surface); }
.tile.hero .value { font-size: 40px; }

/* tables */
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 5px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; }
td.nowrap { white-space: nowrap; }
.id { font-family: var(--mono); font-size: 12px; white-space: nowrap; color: var(--ink); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--wash); }
tr.click:hover td:first-child { border-radius: 8px 0 0 8px; }
tr.click:hover td:last-child { border-radius: 0 8px 8px 0; }
.rank { color: var(--muted); }
.dim { color: var(--muted); }
.sec { color: var(--ink-2); }
.wrap { overflow-wrap: anywhere; }
.task-ttl { display: block; min-width: min(36ch, 45vw); }
td.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0; width: 100%; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* pills */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; background: var(--chip); font-size: 11.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; line-height: 1.7; }
.status { display: inline-flex; align-items: center; gap: 5px; padding: 0 8px 0 6px; border-radius: 999px; font-size: 11.5px; font-weight: 550; white-space: nowrap; background: var(--chip); color: var(--ink-2); line-height: 1.7; }
.status i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; background: currentColor; }
.status.good { background: var(--good-soft); color: var(--good-ink); }
.status.warning { background: var(--warn-soft); color: var(--warn-ink); }
.status.serious { background: var(--warn-soft); color: var(--warn-ink); }
.status.critical { background: var(--crit-soft); color: var(--crit-ink); }
.status.active { background: var(--accent-soft); color: var(--accent-ink); }
.status.active i { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.verdict { white-space: nowrap; }
.verdict small { color: var(--muted); margin-left: 4px; font-size: 11px; }

/* needs you */
.needs { border-left: 3px solid var(--warning); }
.needs.clear { border-left-color: var(--good); display: flex; align-items: center; gap: 8px; padding: 7px 12px; color: var(--ink-2); }
.need { display: grid; grid-template-columns: 20px 1fr auto; gap: 2px 10px; padding: 7px 0; align-items: center; border-bottom: 1px solid var(--grid); align-items: start; }
.need:first-child { padding-top: 2px; }
.need:last-child { border-bottom: 0; padding-bottom: 2px; }
.need .icon { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.need .what { font-weight: 500; }
.need code, .cmd { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.need code { display: inline-block; margin-left: 8px; padding: 0 6px; border-radius: 5px; background: var(--sunken); border: 1px solid var(--border); }
.need .actions, .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.ok-dot { width: 18px; height: 18px; border-radius: 5px; font-size: 11px; display: grid; place-items: center; background: var(--good-soft); color: var(--good-ink); font-weight: 700; }

/* controls */
.btn { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 3px 10px; cursor: pointer; font-weight: 500; box-shadow: var(--shadow); }
.btn:hover { background: var(--wash); }
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 1px 8px; font-size: 12px; font-family: var(--mono); }
select, input[type=search] { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 3px 8px; box-shadow: var(--shadow); }
input[type=search] { min-width: 240px; }
.filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.filters label { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); }
.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--chip); }
.seg button { border: 0; background: none; padding: 4px 12px; border-radius: 7px; cursor: pointer; color: var(--ink-2); font-weight: 500; }
.seg button[aria-pressed=true] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
/* task graph: dependencies left to right */
.tg-wrap { overflow-x: auto; padding: 4px 2px; }
.tg { position: relative; margin: 0 auto; }
.tg svg { position: absolute; inset: 0; pointer-events: none; }
.tg-node { position: absolute; display: flex; flex-direction: column; gap: 4px; text-align: left; font: inherit; color: inherit; background: var(--raised); border: 1px solid var(--border); border-left: 3px solid var(--kc, var(--axis)); border-radius: 8px; padding: 6px 9px; cursor: pointer; }
.tg-node:hover, .tg-node:focus-visible { border-color: var(--accent); border-left-color: var(--kc, var(--axis)); box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
.tg-node .t { font-size: 12.5px; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tg-node .m { display: flex; align-items: center; gap: 6px; margin-top: auto; font-size: 11.5px; min-width: 0; }
.tg-node .m .dim { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tg-node.dropped { opacity: .6; }

/* misc */
.empty { color: var(--muted); padding: 10px 2px; }
.progress { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; min-width: 80px; }
.progress > div { height: 100%; background: var(--series-1); border-radius: 3px; }
.meter + .meter { margin-top: 9px; }
.meter .row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; font-size: 12px; }
.meter .name { font-weight: 500; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.55 var(--mono); background: var(--sunken); border: 1px solid var(--border); padding: 10px 12px; border-radius: 8px; margin: 6px 0; max-height: 360px; overflow: auto; }
.note { padding: 7px 0; border-bottom: 1px solid var(--grid); }
.note:last-child { border-bottom: 0; }
.note .when { color: var(--muted); font-size: 12px; margin-bottom: 2px; }
.finding { padding: 9px 2px; border-bottom: 1px solid var(--grid); }
.finding:last-child { border-bottom: 0; }
.finding > .wrap { max-width: 100ch; }
.finding .head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
.error-box { color: var(--crit-ink); }
.err-banner { background: var(--crit-soft); border: 1px solid var(--border); border-left: 3px solid var(--critical); padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; }
.stale { opacity: .6; transition: opacity .2s; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.18); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 9; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(780px, 100vw); background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow-lg); overflow-y: auto; padding: 0 26px 48px; z-index: 10; transform: translateX(105%); transition: transform .2s ease; }
.drawer.open { transform: none; }
.drawer.wide { width: min(1680px, 96vw); }
.drawer.wide .sec, .drawer.wide .note, .drawer.wide dl.kv, .drawer.wide pre { max-width: 130ch; }
.drawer .dhead { position: sticky; top: 0; z-index: 2; display: flex; justify-content: flex-end; padding: 14px 0 6px; background: linear-gradient(var(--surface) 70%, transparent); }
.drawer h3 { margin: 0 0 6px; font-size: 19px; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.drawer h2 { margin-top: 26px; }

/* charts */
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); margin: 0 0 8px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key-line { width: 16px; height: 2px; border-radius: 1px; display: inline-block; }
.key-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.key-line.dotted { height: 0; background: none !important; border-top: 2px dotted; }
.chart { position: relative; }
.chart svg { display: block; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--raised); border: 1px solid var(--border); border-radius: 10px; padding: 8px 11px; font-size: 12px; box-shadow: var(--shadow-lg); min-width: 140px; max-width: 320px; z-index: 3; }
.tip .v { font-weight: 650; font-size: 13px; font-variant-numeric: tabular-nums; }
.tip .row { display: flex; align-items: center; gap: 8px; }
.tip .t { color: var(--muted); margin-bottom: 4px; overflow-wrap: anywhere; }
.chart .unzoom { position: absolute; top: 2px; right: 18px; z-index: 2; font-size: 11.5px; padding: 0 8px; }
.chart svg rect.hit { cursor: crosshair; }
th button.sort { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
th button.sort[data-dir]::after { content: attr(data-dir); margin-left: 3px; color: var(--muted); }
.colpick { position: relative; }
.colpick > div { position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; background: var(--raised); border: 1px solid var(--border); border-radius: 10px; padding: 8px; box-shadow: var(--shadow-lg); width: 320px; max-height: 360px; overflow: auto; }
.colpick label { display: flex; gap: 6px; align-items: center; font-family: var(--mono); font-size: 12px; padding: 1px 0; }
.colpick label[hidden] { display: none; }
.scatter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; font-size: 12.5px; }
.scatter-bar select { max-width: 260px; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; font-size: 12px; }
.pick .chip { cursor: pointer; border: 1px solid transparent; font-family: var(--mono); }
.pick .chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
.pick .chip:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.pick .chip[hidden] { display: none; }
.multiples { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.multiples > * { min-width: 0; }
.run-stats { grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); margin: 4px 0 6px; }
.run-stats .stat { border-top: 0; }
.run-stats .progress { margin-top: 7px; height: 5px; }
.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.curves-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 12px; }
.curves-bar .seg button { padding: 3px 10px; font-size: 12px; }
.curves { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; }  /* few charts: they share the width */
.curves-bar input[type=search] { min-width: 0; width: 240px; }
.curves-bar .count { color: var(--muted); font-size: 12px; margin-left: auto; }
.curves > .card { min-width: 0; padding: 10px 12px 4px; }
.curves > .card.wide { grid-column: 1 / -1; }
.curve-head { display: flex; align-items: baseline; gap: 8px; }
.curve-head .name { font-family: var(--mono); font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.curve-head .last { margin-left: auto; font-size: 17px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.curve-head .icon-btn { width: 24px; height: 24px; font-size: 13px; }
.curve-sub { color: var(--muted); font-size: 11.5px; margin: 1px 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rprog { display: flex; align-items: center; gap: 6px; }
.rprog .progress { min-width: 54px; width: 54px; height: 4px; }
details.run-details > summary { cursor: pointer; color: var(--ink-2); font-weight: 600; margin-top: 26px; }
.multiples .ttl { font-size: 12px; color: var(--ink-2); margin-bottom: 2px; font-family: var(--mono); }
th.sel, td.sel { width: 1%; padding-right: 0; }
.pickcell { display: block; padding: 1px 2px; cursor: pointer; }
.pickcell input { margin: 0; cursor: pointer; vertical-align: -2px; accent-color: var(--accent); }
.cmp-bar { display: inline-flex; gap: 8px; align-items: center; }
.swatch { width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--c); background: var(--c); cursor: pointer; padding: 0; display: inline-block; vertical-align: -2px; }
.swatch[aria-pressed="false"] { background: transparent; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--c); flex: none; }
.cmp-vals { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 11.5px; margin: 1px 0 4px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.cmp-vals span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.cmp-vals b { font-weight: 600; color: var(--ink); }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0 0; font-size: 12px; }
.suggest .chip { cursor: pointer; border: 1px solid var(--border); font-family: var(--mono); }
.suggest .chip:hover { background: var(--wash); border-color: var(--accent); }
.suggest input[type=search] { min-width: 0; width: 160px; font-size: 12px; }
.chg { background: var(--accent-soft); color: var(--accent-ink); border-radius: 3px; box-shadow: 0 0 0 2px var(--accent-soft); }
.delta { display: block; font-size: 11px; color: var(--muted); }
.cmp-table td { white-space: nowrap; }
.cmp-table td:first-child { white-space: normal; overflow-wrap: anywhere; min-width: 16ch; }
.cmp-table td.cfg { white-space: normal; overflow-wrap: anywhere; max-width: 40ch; }
/* training: runs on the left, the shown ones' curves on the right */
main.wide { max-width: none; }
.ws { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 16px; align-items: start; }
.ws-side { position: sticky; top: 60px; max-height: calc(100vh - 72px); overflow-y: auto; padding: 0; }
.ws-head { position: sticky; top: 0; z-index: 1; background: var(--surface); padding: 10px 12px 8px; border-bottom: 1px solid var(--border); display: grid; gap: 8px; }
.ws-head input[type=search] { width: 100%; }
.ws-filters { display: flex; flex-wrap: wrap; gap: 6px; }
.ws-filters .seg button { padding: 2px 9px; font-size: 12px; }
.ws-check { font-size: 12px; display: flex; align-items: center; gap: 4px; }
.ws-group { display: flex; justify-content: space-between; padding: 10px 12px 4px; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); }
.ws-run { display: flex; gap: 9px; align-items: flex-start; padding: 7px 12px; border-top: 1px solid var(--grid); cursor: pointer; }
.ws-run[hidden] { display: none; }
.ws-run:hover { background: var(--wash); }
.ws-run.on { cursor: default; background: color-mix(in srgb, var(--wash) 60%, transparent); }
.ws-run.full { cursor: default; }
.ws-run .swatch { margin-top: 2px; flex: none; }
.ws-add { flex: none; width: 16px; height: 16px; margin-top: 2px; padding: 0; border: 1.5px solid var(--axis); border-radius: 4px; background: var(--surface); color: var(--muted); font-size: 12px; line-height: 12px; cursor: pointer; }
.ws-run:hover .ws-add:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.ws-add:disabled { opacity: .4; cursor: default; }
.ws-body { min-width: 0; flex: 1; }
.ws-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ws-id { font: 600 12.5px var(--mono); background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); }
.ws-id:hover { color: var(--accent-ink); text-decoration: underline; }
.ws-score { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.ws-meta { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
.ws-hyp { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-acts { display: flex; gap: 2px; align-items: center; flex: none; }
.ws-mk { font-size: 11px; color: var(--muted); background: none; border: 1px solid transparent; border-radius: 6px; padding: 0 5px; cursor: pointer; visibility: hidden; }
.ws-run:hover .ws-mk, .ws-mk:focus-visible { visibility: visible; }
.ws-mk:hover { color: var(--accent-ink); border-color: var(--border); }
.ws-foot { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--grid); font-size: 12px; }
.ws-foot input { min-width: 0; width: 130px; font-size: 12px; }
.ws-main { min-width: 0; }
.ws-main > .curves-bar:first-child, .ws-main h2:first-child { margin-top: 0; }
.ws-sec > summary { cursor: pointer; font-weight: 600; margin: 12px 0 8px; display: flex; align-items: center; gap: 8px; }

// Dependency graph: a task's column is one past its deepest dependency. A link that skips columns passes through a

    path.add(t.id);
    const ds = deps(t);
    const v = ds.length ? 1 + Math.max(...ds.map(d => depth(byId[d], path))) : 0;
    path.delete(t.id);
    return (layer[t.id] = v);
  };

  // nodes: tasks (by id) and waypoints ("w<from>-<to>-<col>"); links: chains of nodes from a dependency to its task
  const col = { ...layer }, preds = {}, succs = {}, links = [];
  const join = (a, b) => { (succs[a] = succs[a] || []).push(b); (preds[b] = preds[b] || []).push(a); };
  for (const t of rows) for (const d of deps(t)) {
    if (layer[d] >= layer[t.id]) continue;  // only where a cycle was cut
    const chain = [d];
    for (let c = layer[d] + 1; c < layer[t.id]; c++) { const w = `w${d}-${t.id}-${c}`; col[w] = c; chain.push(w); }
    chain.push(t.id);

  }
  const cols = []; Object.keys(col).forEach(k => { const id = byId[k] ? +k : k; (cols[col[k]] = cols[col[k]] || []).push(id); });
  const pos = {}, place = c => c.forEach((id, i) => { pos[id] = i; });
  const rank = id => typeof id === "number" ? id : parseFloat(id.slice(1));
  cols.forEach(c => { c.sort((a, b) => rank(a) - rank(b)); place(c); });
  const mean = (id, ns) => ns && ns.length ? ns.reduce((acc, n) => acc + pos[n], 0) / ns.length : pos[id];
  for (let pass = 0; pass < 6; pass++) {
    const fwd = pass % 2 === 0;
    for (const c of fwd ? cols.slice(1) : cols.slice(0, -1).reverse()) {
      const key = Object.fromEntries(c.map(id => [id, mean(id, fwd ? preds[id] : succs[id])]));

}

const RENDER = { status: renderStatus, training: renderTraining, runs: renderRuns, tasks: renderTasks, findings: renderFindings, subs: renderSubs };
const main = document.getElementById("main");
let loading = false, loadAgain = false, lastLoad = 0;
const drawn = new Map();  // "comp tab" -> what that tab last showed: shown again at once while it refreshes
async function load() {
  if (loading) { loadAgain = true; return; }  // asked meanwhile (another tab, a filter): once this one ends
  loading = true;
  const tab = TAB, comp = COMP, current = () => tab === TAB && comp === COMP;
  main.classList.add("stale");
  try {
    const nodes = (await RENDER[tab]()).flat(Infinity).filter(Boolean);
    if (current()) {
      const y = window.scrollY, f = document.activeElement;
      const keep = f && main.contains(f) && f.dataset.keep ? [f.dataset.keep, f.selectionStart, f.selectionEnd] : null;  // typing in it as it refreshes
      const scrolls = [...main.querySelectorAll("[data-scroll]")].map(el => [el.dataset.scroll, el.scrollTop]);  // a panel that scrolls itself
      main.replaceChildren(...nodes);
      for (const [k, top] of scrolls) { const el = main.querySelector(`[data-scroll="${k}"]`); if (el) el.scrollTop = top; }
      const again = keep && main.querySelector(`[data-keep="${keep[0]}"]`);
      if (again) { again.focus({ preventScroll: true }); try { again.setSelectionRange(keep[1], keep[2]); } catch (e) { } }
      window.scrollTo(0, y);
      drawn.set(`${comp} ${tab}`, nodes);
      lastLoad = Date.now();
    }
  } catch (e) { if (current()) main.replaceChildren(errBox(e)); }
  finally {
    main.classList.remove("stale"); loading = false; tickUpdated();
    if (loadAgain || !current()) { loadAgain = false; load(); }
  }
}
function tickUpdated() { document.getElementById("updated").textContent = lastLoad ? `updated ${dur((Date.now() - lastLoad) / 1000)} ago` : ""; }
