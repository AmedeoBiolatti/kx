[package]
name = "kx"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[workspace]

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
strip = true
